services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediq}
      POSTGRES_USER: ${POSTGRES_USER:-mediq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ADR-007: schema applied via init script, no Alembic.
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediq} -d ${POSTGRES_DB:-mediq}"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5-community
    environment:
      # NOTE: no NEO4J_PASSWORD here — the 5.x image maps every NEO4J_* env var
      # to a config entry and strict-validation rejects the bare PASSWORD one.
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change-me-local-only}
    volumes:
      - neo4jdata:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      # password interpolated from .env at compose parse time (keep NEO4J_PASSWORD
      # in .env in sync with the password embedded in NEO4J_AUTH)
      test: ["CMD-SHELL", "/var/lib/neo4j/bin/cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-change-me-local-only}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app            # hot reload during dev
      - uploads:/data/uploads     # MRI scan stub storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      # docs/11-observability-spec.md Section 3
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend             # placeholder scaffold — swap for the real React app
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
  neo4jdata:
  uploads:
