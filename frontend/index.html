<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MedIQ — frontend placeholder</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; background:#0F172A; color:#E2E8F0;
             display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
      .card { max-width:560px; padding:2.5rem; border:1px solid #1E293B; border-radius:12px; background:#111C33; }
      h1 { margin-top:0; font-size:1.4rem; } code { background:#0B1222; padding:.15rem .35rem; border-radius:4px; }
      a { color:#38BDF8; } li { margin:.3rem 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>MedIQ backend is running</h1>
      <p>This is the placeholder frontend service (React + TS app mounts here later).</p>
      <ul>
        <li>API + Swagger: <a href="http://localhost:8000/docs">localhost:8000/docs</a></li>
        <li>Health: <a href="http://localhost:8000/api/health">localhost:8000/api/health</a></li>
        <li>Neo4j browser: <a href="http://localhost:7474">localhost:7474</a></li>
      </ul>
      <p>Seeded login: <code>doctor@mediq.local</code> (see .env.example)</p>
    </div>
  </body>
</html>
