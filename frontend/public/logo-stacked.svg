<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="100%" height="100%">
  <defs>
    <!-- Outer Blue Stroke & Metallic Gradients -->
    <linearGradient id="blueBorderGradS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A5080"/>
      <stop offset="50%" stop-color="#0080C0"/>
      <stop offset="100%" stop-color="#083050"/>
    </linearGradient>

    <linearGradient id="silverFillGradS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2F6F9"/>
      <stop offset="50%" stop-color="#D9E3EA"/>
      <stop offset="100%" stop-color="#B8C8D4"/>
    </linearGradient>

    <radialGradient id="eyeIrisS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="35%" stop-color="#0077B6"/>
      <stop offset="80%" stop-color="#023E8A"/>
      <stop offset="100%" stop-color="#03045E"/>
    </radialGradient>

    <radialGradient id="eyeScleraS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EDF5FA"/>
      <stop offset="100%" stop-color="#C5DAE8"/>
    </radialGradient>
  </defs>

  <g transform="translate(40, 10)">
    <!-- Main 'M' Outer Metallic Structure -->
    <g fill="none" stroke-linejoin="miter">
      <path d="M 36,190 L 36,36 L 86,36 L 120,96 L 154,36 L 204,36 L 204,190 L 168,190 L 168,92 L 134,152 L 106,152 L 72,92 L 72,190 Z" 
            fill="url(#silverFillGradS)" stroke="url(#blueBorderGradS)" stroke-width="5"/>
      <path d="M 106,152 L 120,178 L 134,152 Z" fill="url(#silverFillGradS)" stroke="url(#blueBorderGradS)" stroke-width="5"/>

      <!-- Circuit Traces -->
      <path d="M 54,62 L 54,164" stroke="#0077B6" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="54" cy="62" r="6" fill="#0080C0" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="54" cy="164" r="6" fill="#0080C0" stroke="#FFFFFF" stroke-width="2.5"/>

      <path d="M 186,62 L 186,164" stroke="#0077B6" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="186" cy="62" r="6" fill="#0080C0" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="186" cy="164" r="6" fill="#0080C0" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>

    <!-- Central Eye Lens Emblem -->
    <g>
      <path d="M 44,112 Q 120,52 196,112 Q 120,172 44,112 Z" fill="url(#eyeScleraS)" stroke="#005B94" stroke-width="5"/>
      <path d="M 49,112 Q 120,58 191,112 Q 120,166 49,112 Z" fill="none" stroke="#00A8E8" stroke-width="2" opacity="0.9"/>
      <circle cx="120" cy="112" r="32" fill="url(#eyeIrisS)" stroke="#0096D6" stroke-width="3"/>
      <circle cx="120" cy="112" r="26" fill="none" stroke="#90E0EF" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cx="120" cy="112" r="21" fill="none" stroke="#E0F7FC" stroke-width="1.5" stroke-dasharray="2 3"/>
      <circle cx="120" cy="112" r="15" fill="#03045E"/>
      <circle cx="127" cy="104" r="5" fill="#FFFFFF"/>
      <circle cx="112" cy="120" r="2" fill="#FFFFFF" opacity="0.7"/>
    </g>
  </g>

  <!-- Typography matching exact font style in logo -->
  <g text-anchor="middle">
    <!-- Brand Name "MedIQ" -->
    <text x="160" y="260" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#006A62" letter-spacing="-1.5">MedIQ</text>
    <!-- Tagline "MEDICAL TECHNOLOGY" -->
    <text x="160" y="295" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#006A62" letter-spacing="4">MEDICAL TECHNOLOGY</text>
  </g>
</svg>
